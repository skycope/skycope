<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#76bce8">
<meta name="description" content="Sky Cope — somewhere between the clouds and the code.">
<title>Sky Cope</title>
<style>
  @font-face {
    font-family: "Departure Mono";
    src: url("/fonts/DepartureMono-Regular.woff2") format("woff2");
    font-display: swap;
  }

  :root {
    color-scheme: dark;
    font-family: "Departure Mono", ui-monospace, monospace;
    background: #76bce8;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: #102b42;
    background: #76bce8;
    transition: color 900ms ease, background-color 900ms ease;
  }

  body[data-scene="1"] { color: #fff4e7; background: #5f4b88; }
  body[data-scene="2"] { color: #dcecff; background: #061127; }

  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background:
      radial-gradient(circle at 72% 28%, rgba(255,255,234,.88) 0 3%, transparent 12%),
      radial-gradient(ellipse at 22% 72%, rgba(255,255,255,.72) 0 8%, transparent 34%),
      linear-gradient(#3f93d3, #c6e8f8 72%, #f4fbff);
    transition: background 900ms ease, opacity 600ms ease;
  }

  body[data-scene="1"] #sky {
    background:
      radial-gradient(circle at 73% 68%, rgba(255,225,160,.86) 0 3%, transparent 14%),
      radial-gradient(ellipse at 22% 70%, rgba(255,184,160,.36) 0 10%, transparent 38%),
      linear-gradient(#192653, #8b5488 58%, #ec956f);
  }

  body[data-scene="2"] #sky {
    background:
      radial-gradient(circle at 74% 26%, rgba(220,238,255,.82) 0 2%, transparent 9%),
      radial-gradient(ellipse at 22% 72%, rgba(114,154,208,.18) 0 10%, transparent 40%),
      linear-gradient(#020716, #0a1b3c 62%, #2f4967);
  }

  main {
    position: relative;
    z-index: 1;
    padding: 2rem;
    isolation: isolate;
  }

  main::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: -4rem -6rem;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(235,247,255,.23), transparent 66%);
    filter: blur(18px);
    pointer-events: none;
  }

  h1 {
    margin: 0 0 .75rem;
    font-size: clamp(1.2rem, 1rem + .5vw, 1.55rem);
    font-weight: 400;
    letter-spacing: -.03em;
    text-shadow: 0 1px 18px rgba(255,255,255,.28);
  }

  p { margin: 0; color: currentColor; }
  main p { font-size: .8rem; opacity: .58; }
  .cursor { animation: blink 1.1s steps(1) infinite; }

  .weather {
    position: fixed;
    z-index: 2;
    left: 50%;
    bottom: max(1.5rem, env(safe-area-inset-bottom));
    display: flex;
    gap: 1.4rem;
    transform: translateX(-50%);
  }

  .weather button {
    position: relative;
    padding: .55rem .1rem;
    border: 0;
    color: currentColor;
    background: transparent;
    font: inherit;
    font-size: .65rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    opacity: .42;
    cursor: pointer;
    transition: opacity 200ms ease, transform 200ms ease;
  }

  .weather button::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: .15rem;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0;
    transform: translateX(-50%) scale(0);
    transition: opacity 200ms ease, transform 200ms ease;
  }

  .weather button:hover,
  .weather button:focus-visible,
  .weather button[aria-pressed="true"] { opacity: .92; }

  .weather button:hover { transform: translateY(-1px); }

  .weather button[aria-pressed="true"]::after {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  .weather button:focus-visible {
    outline: 1px solid currentColor;
    outline-offset: 4px;
  }

  .hint {
    position: fixed;
    z-index: 1;
    right: 1.5rem;
    top: 50%;
    margin: 0;
    font-size: .6rem;
    letter-spacing: .08em;
    opacity: .34;
    writing-mode: vertical-rl;
    transform: translateY(-50%);
  }

  @keyframes blink { 50% { opacity: 0; } }

  @media (max-width: 520px) {
    .hint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body data-scene="0">
<canvas id="sky" aria-hidden="true"></canvas>

<main>
  <h1>sky cope<span class="cursor">_</span></h1>
  <p>coming soon</p>
</main>

<nav class="weather" aria-label="Choose a sky">
  <button type="button" data-scene="0" aria-pressed="true">day</button>
  <button type="button" data-scene="1" aria-pressed="false">dusk</button>
  <button type="button" data-scene="2" aria-pressed="false">night</button>
</nav>

<p class="hint" aria-hidden="true">move through the atmosphere</p>

<script type="module" src="/src/main.js"></script>
</body>
</html>
