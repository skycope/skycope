<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4db8f5">
<meta name="description" content="Sky Cope — somewhere between the clouds and the code.">
<title>Sky Cope</title>
<style>
  @font-face {
    font-family: "Departure Mono";
    src: url("/fonts/DepartureMono-Regular.woff2") format("woff2");
    font-display: swap;
  }

  :root {
    color-scheme: dark;
    font-family: "Departure Mono", ui-monospace, monospace;
    background: #4db8f5;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: #0b3154;
    background: #4db8f5;
    transition: color 1200ms cubic-bezier(.22, 1, .36, 1),
      background-color 1200ms cubic-bezier(.22, 1, .36, 1);
  }

  body[data-scene="1"] { color: #fff8ee; background: #8a63c7; }
  body[data-scene="2"] { color: #eef1ff; background: #17295f; }

  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background:
      radial-gradient(circle at 72% 28%, rgba(255,245,188,.96) 0 3%, transparent 14%),
      radial-gradient(ellipse at 22% 72%, rgba(255,255,255,.78) 0 8%, transparent 34%),
      linear-gradient(#229ce9, #8ddcff 66%, #f8fdff);
    filter: saturate(1.08);
    transition: background 1200ms cubic-bezier(.22, 1, .36, 1),
      opacity 600ms ease;
  }

  body[data-scene="1"] #sky {
    background:
      radial-gradient(circle at 73% 68%, rgba(255,235,156,.96) 0 3%, transparent 16%),
      radial-gradient(ellipse at 22% 70%, rgba(255,183,203,.46) 0 10%, transparent 40%),
      linear-gradient(#4f4297, #c46cab 56%, #ff9a78 82%, #ffd18b);
  }

  body[data-scene="2"] #sky {
    background:
      radial-gradient(circle at 74% 26%, rgba(232,239,255,.92) 0 2%, transparent 11%),
      radial-gradient(ellipse at 22% 72%, rgba(139,180,255,.24) 0 10%, transparent 42%),
      linear-gradient(#07143c, #223c7a 62%, #685d9d);
  }

  main {
    position: relative;
    z-index: 1;
    padding: 2rem;
    isolation: isolate;
    animation: float 8s ease-in-out infinite;
  }

  main::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: -4rem -6rem;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(245,252,255,.3), transparent 66%);
    filter: blur(22px);
    pointer-events: none;
  }

  h1 {
    margin: 0 0 .75rem;
    font-size: clamp(1.2rem, 1rem + .5vw, 1.55rem);
    font-weight: 400;
    letter-spacing: -.03em;
    text-shadow: 0 1px 20px rgba(255,255,255,.38);
  }

  p { margin: 0; color: currentColor; }
  main p { font-size: .8rem; opacity: .58; }
  .cursor { animation: blink 1.8s ease-in-out infinite; }

  .weather {
    position: fixed;
    z-index: 2;
    left: 50%;
    bottom: max(1.5rem, env(safe-area-inset-bottom));
    display: flex;
    gap: .1rem;
    padding: .28rem;
    border: 1px solid rgba(255,255,255,.24);
    border-radius: 999px;
    background: rgba(255,255,255,.11);
    box-shadow: 0 12px 34px rgba(27,42,95,.12),
      inset 0 1px rgba(255,255,255,.2);
    backdrop-filter: blur(18px) saturate(1.22);
    -webkit-backdrop-filter: blur(18px) saturate(1.22);
    transform: translateX(-50%);
  }

  .weather button {
    position: relative;
    padding: .55rem .78rem;
    border: 0;
    border-radius: 999px;
    color: currentColor;
    background: transparent;
    font: inherit;
    font-size: .65rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    opacity: .54;
    cursor: pointer;
    transition: opacity 300ms ease, transform 300ms ease,
      background-color 500ms cubic-bezier(.22, 1, .36, 1),
      box-shadow 500ms ease;
  }

  .weather button::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: .3rem;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0;
    transform: translateX(-50%) scale(0);
    transition: opacity 200ms ease, transform 200ms ease;
  }

  .weather button:hover,
  .weather button:focus-visible,
  .weather button[aria-pressed="true"] { opacity: .92; }

  .weather button:hover { transform: translateY(-1px); }

  .weather button[aria-pressed="true"]::after {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  .weather button[aria-pressed="true"] {
    background: rgba(255,255,255,.18);
    box-shadow: inset 0 1px rgba(255,255,255,.22),
      0 4px 16px rgba(40,50,105,.08);
  }

  .weather button:focus-visible {
    outline: 1px solid currentColor;
    outline-offset: 4px;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  @keyframes blink {
    0%, 38%, 100% { opacity: 1; }
    52%, 86% { opacity: .16; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body data-scene="0">
<canvas id="sky" aria-hidden="true"></canvas>

<main>
  <h1>sky cope<span class="cursor">_</span></h1>
  <p>coming soon</p>
</main>

<nav class="weather" aria-label="Choose a sky">
  <button type="button" data-scene="0" aria-pressed="true">day</button>
  <button type="button" data-scene="1" aria-pressed="false">dusk</button>
  <button type="button" data-scene="2" aria-pressed="false">night</button>
</nav>

<script type="module" src="/src/main.js"></script>
</body>
</html>
