<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8fc4e3" />
    <meta name="description" content="Sky Cope. Cape Town’s live sky." />
    <title>Sky Cope</title>
    <style>
      @font-face {
        font-family: "Departure Mono";
        src: url("/fonts/DepartureMono-Regular.woff2") format("woff2");
        font-display: swap;
      }
      :root {
        font-family: "Departure Mono", ui-monospace, monospace;
        color-scheme: light;
        background: #8fc4e3;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        min-height: 100svh;
        color: #183747;
        background: #8fc4e3;
        transition: color 1s ease;
      }
      body[data-scene="1"] {
        color: #fff3dc;
      }
      body[data-scene="0"][data-gloom="true"] {
        color: #e6edf0;
      }
      body[data-scene="2"] {
        color: #dce7ed;
        color-scheme: dark;
      }
      #sky,
      #landscape,
      .fallback {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #sky {
        z-index: 0;
        image-rendering: auto;
        opacity: 0;
        transition: opacity 0.7s ease;
      }
      #landscape {
        z-index: 0;
      }
      body[data-renderer="webgpu"] #sky {
        opacity: 1;
      }
      .fallback {
        background: linear-gradient(#406e86, #9cbec1 65%, #32644f);
        overflow: hidden;
      }
      body[data-scene="1"] .fallback {
        background: linear-gradient(#4c4867, #c8959b 65%, #efba8b);
      }
      body[data-scene="2"] .fallback {
        background: linear-gradient(#091323, #253d52 70%, #506474);
      }
      .fallback::before,
      .fallback::after {
        content: "";
        position: absolute;
        left: -10%;
        width: 120%;
        bottom: 0;
        height: 35%;
        opacity: 0.6;
        background: #355f46;
        clip-path: polygon(
          0 22%,
          8% 22%,
          8% 14%,
          18% 14%,
          18% 28%,
          25% 28%,
          25% 40%,
          37% 40%,
          37% 34%,
          46% 34%,
          46% 52%,
          60% 52%,
          60% 37%,
          70% 37%,
          70% 20%,
          79% 20%,
          79% 10%,
          88% 10%,
          88% 24%,
          100% 24%,
          100% 100%,
          0 100%
        );
      }
      .fallback::after {
        bottom: -10%;
        left: -20%;
        width: 140%;
        opacity: 0.7;
        background: #274c37;
      }
      body[data-scene="2"] .fallback::before,
      body[data-scene="2"] .fallback::after {
        background: #445871;
      }
      body[data-renderer="webgpu"] .fallback {
        visibility: hidden;
        transition: visibility 1s;
      }
      html,
      body {
        overscroll-behavior: none;
      }
      body {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .sky-meta {
        position: fixed;
        z-index: 2;
        inset: 1.6rem 2rem auto;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        grid-template-areas: "place name meta";
        align-items: start;
        gap: 1rem;
        font-size: 0.65rem;
        line-height: 1.9;
      }
      .sky-meta > .place-wrap {
        grid-area: place;
      }
      .sky-meta > h1 {
        grid-area: name;
      }
      .sky-meta > .conditions {
        grid-area: meta;
        justify-self: end;
        display: flex;
        gap: 0.9rem;
        align-items: start;
      }
      .panel-anchor {
        position: relative;
      }
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.2rem 0 0.2rem 0.4rem;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .toggle:hover > span:first-child {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .toggle[aria-expanded="true"] .chevron {
        transform: translateY(1px) rotate(225deg);
      }
      .place {
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }
      .place svg {
        width: 15px;
        height: 15px;
        opacity: 0.75;
      }
      .conditions {
        text-align: right;
      }
      .conditions {
        position: relative;
      }
      .chevron {
        width: 5px;
        height: 5px;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        transform: translateY(-2px) rotate(45deg);
        opacity: 0.7;
        transition: transform 0.2s ease;
      }
      .weather-panel,
      .time-panel {
        position: absolute;
        right: 0;
        top: calc(100% + 0.6rem);
        width: min(300px, calc(100vw - 2.6rem));
        padding: 0.9rem 1rem 0.7rem;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        background: rgba(225, 236, 240, 0.16);
        box-shadow:
          0 8px 40px rgba(17, 33, 54, 0.1),
          inset 0 1px rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        text-align: left;
        line-height: 1.4;
      }
      .weather-panel[hidden],
      .time-panel[hidden] {
        display: none;
      }
      .presets {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.35rem;
        margin-bottom: 0.8rem;
      }
      .presets button {
        min-height: 30px;
        padding: 0.3rem 0.2rem;
        border: 1px solid currentColor;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 0.58rem;
        cursor: pointer;
        opacity: 0.6;
      }
      .presets button:hover {
        opacity: 0.9;
      }
      .presets button[aria-pressed="true"] {
        opacity: 1;
        background: rgba(255, 255, 255, 0.22);
      }
      .dial {
        display: grid;
        grid-template-columns: 2.6rem 1fr 4.2rem;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.56rem;
      }
      .dial span {
        opacity: 0.72;
      }
      .dial output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .dial input {
        width: 100%;
        height: 26px;
        margin: 0;
        accent-color: currentColor;
        cursor: ew-resize;
      }
      .dial input:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .weather-panel[data-mode="live"] .dial output {
        opacity: 0.6;
      }
      .source {
        margin: 0.5rem 0 0;
        font-size: 0.48rem;
        opacity: 0.6;
      }
      h1 {
        margin: 0;
        font-size: clamp(1rem, 0.7rem + 1vw, 1.45rem);
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: -0.06em;
        text-align: center;
        white-space: nowrap;
        text-shadow: 0 1px 14px rgba(20, 40, 55, 0.18);
      }
      .cursor {
        opacity: 0.45;
        animation: blink 2.4s steps(1) infinite;
      }
      .time-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
      }
      .time-heading label {
        font-size: 0.58rem;
        opacity: 0.72;
      }
      .time-heading output {
        font-size: 0.65rem;
        font-variant-numeric: tabular-nums;
      }
      #live {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.45rem 0.5rem;
        min-height: 32px;
        border: 1px solid currentColor;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 0.55rem;
        cursor: pointer;
        opacity: 0.75;
      }
      #live::before {
        content: "";
        width: 4px;
        height: 4px;
        background: currentColor;
        opacity: 0.35;
      }
      #live[aria-pressed="true"]::before {
        background: #7cb582;
        opacity: 1;
        box-shadow: 0 0 7px rgba(124, 181, 130, 0.5);
      }
      #live:hover {
        opacity: 1;
      }
      #time {
        width: 100%;
        height: 38px;
        margin: 0.2rem 0 0;
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
        cursor: ew-resize;
        color: inherit;
      }
      #time::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 1px;
        background: linear-gradient(
          90deg,
          #385474,
          #9e899d 22%,
          #e8caaa 30%,
          #f3e3bd 50%,
          #ecb187 73%,
          #8e718d 81%,
          #385474
        );
      }
      #time::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 9px;
        height: 13px;
        margin-top: -5px;
        border: 2px solid currentColor;
        border-radius: 1px;
        background: #edf0df;
        box-shadow: 0 0 0 3px rgba(39, 53, 66, 0.1);
      }
      #time::-moz-range-track {
        height: 3px;
        background: linear-gradient(
          90deg,
          #385474,
          #e8caaa 30%,
          #f3e3bd 50%,
          #ecb187 73%,
          #385474
        );
      }
      #time::-moz-range-thumb {
        width: 6px;
        height: 10px;
        border: 2px solid currentColor;
        border-radius: 1px;
        background: #edf0df;
      }
      :focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 5px;
      }
      .time-scale {
        display: flex;
        justify-content: space-between;
        font-size: 0.45rem;
        opacity: 0.48;
        pointer-events: none;
      }
      .preview-note {
        margin: 0.5rem 0 0;
        text-align: center;
        font-size: 0.48rem;
        opacity: 0.55;
        display: none;
      }
      body[data-preview="true"] .preview-note {
        display: block;
      }
      .corner {
        position: fixed;
        z-index: 2;
        right: 1.6rem;
        bottom: max(1.4rem, env(safe-area-inset-bottom));
      }
      #sound {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        background: rgba(225, 236, 240, 0.14);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: inherit;
        cursor: pointer;
      }
      #sound svg {
        width: 16px;
        height: 16px;
      }
      #sound[aria-pressed="false"] .waves {
        display: none;
      }
      #sound[aria-pressed="true"] .mute {
        display: none;
      }
      #hint {
        position: fixed;
        z-index: 2;
        left: 50%;
        bottom: max(1.8rem, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        margin: 0;
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
        background: rgba(20, 35, 45, 0.22);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #f3f1e8;
        font-size: 0.55rem;
        white-space: nowrap;
        pointer-events: none;
        transition: opacity 1.2s ease 0.5s;
      }
      #hint[data-hidden="true"] {
        opacity: 0;
      }
      #hint .touch {
        display: none;
      }
      @media (pointer: coarse) {
        #hint .touch {
          display: inline;
        }
        #hint .mouse {
          display: none;
        }
      }
      a {
        color: inherit;
        text-underline-offset: 3px;
      }
      @keyframes blink {
        0%,
        65%,
        100% {
          opacity: 0.45;
        }
        66%,
        99% {
          opacity: 0;
        }
      }
      @media (max-width: 640px) {
        .sky-meta {
          inset: max(0.9rem, env(safe-area-inset-top)) 1rem auto;
          grid-template-columns: auto 1fr;
          grid-template-areas: "name name" "place meta";
          row-gap: 0.3rem;
          font-size: 0.56rem;
        }
        .sky-meta > .conditions {
          gap: 0.5rem;
        }
        .corner {
          right: 1rem;
        }
      }
      @media (max-height: 480px) {
        .sky-meta {
          inset: 0.8rem 1rem auto;
        }
      }

      .loading-screen {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #cfe0e6; color: #2b4a52; font-size: 0.8rem; letter-spacing: 0.08em;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      .loading-screen[hidden] { display: none; }
      .loading-screen[data-state="leaving"] { opacity: 0; visibility: hidden; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body data-scene="0">
    <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">loading</div>

    <div class="fallback" aria-hidden="true"></div>
    <canvas id="sky" aria-hidden="true"></canvas>
    <canvas id="landscape" aria-hidden="true"></canvas>
    <header class="sky-meta">
      <div class="place-wrap">
        <div class="place">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M6 1h4v2h2v2h1v5h-2v2H9v3H7v-3H5v-2H3V5h1V3h2Z"
              stroke="currentColor"
            />
            <path d="M7 5h2v3H7z" fill="currentColor" /></svg
          ><span>cape town</span>
        </div>
      </div>
      <h1>sky cope<span class="cursor">_</span></h1>
      <div class="conditions">
        <div class="panel-anchor">
          <button
            id="time-toggle"
            class="toggle"
            type="button"
            aria-expanded="false"
            aria-controls="time-panel"
            aria-label="Time of day"
          >
            <span>--:--</span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <section id="time-panel" class="time-panel" aria-label="Sky time preview" hidden>
            <div class="time-heading">
              <label for="time">time · SAST</label
              ><output id="time-label" for="time">--:--</output
              ><button id="live" type="button" aria-pressed="true">live</button>
            </div>
            <input
              id="time"
              type="range"
              min="0"
              max="1439"
              step="1"
              value="720"
              aria-label="Preview Cape Town time of day"
            />
            <div class="time-scale" aria-hidden="true">
              <span>00</span><span>06</span><span>12</span><span>18</span
              ><span>24</span>
            </div>
            <p class="preview-note">preview · current weather</p>
          </section>
        </div>
        <div class="panel-anchor">
        <button
          id="weather-toggle"
          class="toggle"
          type="button"
          aria-expanded="false"
          aria-controls="weather-panel"
        >
          <span id="conditions" role="status">weather…</span>
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <section id="weather-panel" class="weather-panel" aria-label="Weather" hidden>
          <div class="presets" role="group" aria-label="Weather preset">
            <button type="button" data-preset="live">live</button>
            <button type="button" data-preset="clear">clear</button>
            <button type="button" data-preset="cloudy">cloudy</button>
            <button type="button" data-preset="overcast">overcast</button>
            <button type="button" data-preset="rain">rain</button>
            <button type="button" data-preset="storm">storm</button>
          </div>
          <label class="dial">
            <span>cloud</span>
            <input id="weather-cover" name="cover" type="range" min="0" max="100" step="1" value="0" />
            <output for="weather-cover">0%</output>
          </label>
          <label class="dial">
            <span>wind</span>
            <input id="weather-speed" name="speed" type="range" min="0" max="20" step="1" value="0" />
            <output for="weather-speed">0 m/s</output>
          </label>
          <label class="dial">
            <span>from</span>
            <input id="weather-direction" name="direction" type="range" min="0" max="355" step="5" value="0" />
            <output for="weather-direction">n 0°</output>
          </label>
          <label class="dial">
            <span>rain</span>
            <input id="weather-rain" name="rain" type="range" min="0" max="10" step="0.5" value="0" />
            <output for="weather-rain">0 mm/h</output>
          </label>
          <p class="source">
            live data: <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">open-meteo</a> model
          </p>
        </section>
        </div>
      </div>
    </header>
    <p id="hint">
      <span class="mouse">click to walk · drag to look · wasd · shift run · space jump · m meow</span
      ><span class="touch">tap to walk · drag to look · pinch to zoom · tap the cat</span>
    </p>
    <div class="corner">
      <button id="sound" type="button" aria-pressed="true" aria-label="Sound">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor" stroke="none" />
          <path class="waves" d="M11 5.5c1 1.4 1 3.6 0 5M13 3.5c2 2.5 2 6.5 0 9" />
          <path class="mute" d="M11 6l4 4M15 6l-4 4" />
        </svg>
      </button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
