<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Cope</title>
<style>
  @font-face {
    font-family: "Departure Mono";
    src: url("/fonts/DepartureMono-Regular.woff2") format("woff2");
    font-display: swap;
  }
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: "Departure Mono", ui-monospace, monospace;
    background: light-dark(#f4f4f0, #0c0c0c);
    color: light-dark(#1a1a1a, #e8e8e3);
  }
  main { padding: 2rem; }
  h1 { font-size: 1.25rem; font-weight: 400; margin: 0 0 0.75rem; }
  p { margin: 0; font-size: 0.875rem; color: light-dark(#777, #888); }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<main>
  <h1>sky cope<span class="cursor">_</span></h1>
  <p>coming soon</p>
</main>
</body>
</html>
