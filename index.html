<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8fc4e3" />
    <meta name="description" content="Sky Cope. Cape Town’s live sky." />
    <title>Sky Cope</title>
    <style>
      @font-face {
        font-family: "Departure Mono";
        src: url("/fonts/DepartureMono-Regular.woff2") format("woff2");
        font-display: swap;
      }
      :root {
        font-family: "Departure Mono", ui-monospace, monospace;
        color-scheme: light;
        background: #8fc4e3;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        min-height: 100svh;
        color: #183747;
        background: #8fc4e3;
        transition: color 1s ease;
      }
      body[data-scene="1"] {
        color: #fff3dc;
      }
      body[data-scene="0"][data-gloom="true"] {
        color: #e6edf0;
      }
      body[data-scene="2"] {
        color: #dce7ed;
        color-scheme: dark;
      }
      #sky,
      #landscape,
      .fallback {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #sky {
        z-index: 0;
        image-rendering: auto;
        opacity: 0;
        transition: opacity 0.7s ease;
      }
      #landscape {
        z-index: 0;
      }
      body[data-renderer="webgpu"] #sky {
        opacity: 1;
      }
      .fallback {
        background: linear-gradient(#406e86, #9cbec1 65%, #32644f);
        overflow: hidden;
      }
      body[data-scene="1"] .fallback {
        background: linear-gradient(#4c4867, #c8959b 65%, #efba8b);
      }
      body[data-scene="2"] .fallback {
        background: linear-gradient(#091323, #253d52 70%, #506474);
      }
      .fallback::before,
      .fallback::after {
        content: "";
        position: absolute;
        left: -10%;
        width: 120%;
        bottom: 0;
        height: 35%;
        opacity: 0.6;
        background: #355f46;
        clip-path: polygon(
          0 22%,
          8% 22%,
          8% 14%,
          18% 14%,
          18% 28%,
          25% 28%,
          25% 40%,
          37% 40%,
          37% 34%,
          46% 34%,
          46% 52%,
          60% 52%,
          60% 37%,
          70% 37%,
          70% 20%,
          79% 20%,
          79% 10%,
          88% 10%,
          88% 24%,
          100% 24%,
          100% 100%,
          0 100%
        );
      }
      .fallback::after {
        bottom: -10%;
        left: -20%;
        width: 140%;
        opacity: 0.7;
        background: #274c37;
      }
      body[data-scene="2"] .fallback::before,
      body[data-scene="2"] .fallback::after {
        background: #445871;
      }
      /* After a failure the land canvas keeps its last frame: hide it, so
         the static sky is not left with a frozen island over it. */
      body[data-renderer="fallback"] #landscape {
        visibility: hidden;
      }
      body[data-renderer="webgpu"] .fallback {
        visibility: hidden;
        transition: visibility 1s;
      }
      html,
      body {
        overscroll-behavior: none;
      }
      body {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .sky-meta {
        position: fixed;
        z-index: 2;
        inset: 1.6rem 2rem auto;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        grid-template-areas: "place name meta";
        align-items: start;
        gap: 1rem;
        font-size: 0.65rem;
        line-height: 1.9;
      }
      .sky-meta > .place-wrap {
        grid-area: place;
      }
      .sky-meta > h1 {
        grid-area: name;
      }
      .sky-meta > .conditions {
        grid-area: meta;
        justify-self: end;
        display: flex;
        gap: 0.9rem;
        align-items: start;
      }
      .panel-anchor {
        position: relative;
      }
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.2rem 0 0.2rem 0.4rem;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .toggle:hover > span:first-child {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .toggle[aria-expanded="true"] .chevron {
        transform: translateY(1px) rotate(225deg);
      }
      .place {
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }
      .place svg {
        width: 15px;
        height: 15px;
        opacity: 0.75;
      }
      .conditions {
        text-align: right;
        position: relative;
      }
      .chevron {
        width: 5px;
        height: 5px;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        transform: translateY(-2px) rotate(45deg);
        opacity: 0.7;
        transition: transform 0.2s ease;
      }
      .weather-panel,
      .time-panel,
      .notes-panel {
        position: absolute;
        right: 0;
        top: calc(100% + 0.6rem);
        width: min(300px, calc(100vw - 2.6rem));
        padding: 0.9rem 1rem 0.7rem;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        background: rgba(225, 236, 240, 0.16);
        box-shadow:
          0 8px 40px rgba(17, 33, 54, 0.1),
          inset 0 1px rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        text-align: left;
        line-height: 1.4;
      }
      .weather-panel[hidden],
      .time-panel[hidden],
      .notes-panel[hidden] {
        display: none;
      }
      .presets {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.35rem;
        margin-bottom: 0.8rem;
      }
      .presets button {
        min-height: 30px;
        padding: 0.3rem 0.2rem;
        border: 1px solid currentColor;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 0.58rem;
        cursor: pointer;
        opacity: 0.6;
      }
      .presets button:hover {
        opacity: 0.9;
      }
      .presets button[aria-pressed="true"] {
        opacity: 1;
        background: rgba(255, 255, 255, 0.22);
      }
      .dial {
        display: grid;
        grid-template-columns: 2.6rem 1fr 4.2rem;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.56rem;
      }
      .dial span {
        opacity: 0.72;
      }
      .dial output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .dial input {
        width: 100%;
        height: 26px;
        margin: 0;
        accent-color: currentColor;
        cursor: ew-resize;
      }
      .dial input:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .weather-panel[data-mode="live"] .dial output {
        opacity: 0.6;
      }
      .source {
        margin: 0.5rem 0 0;
        font-size: 0.48rem;
        opacity: 0.6;
      }
      h1 {
        margin: 0;
        font-size: clamp(1rem, 0.7rem + 1vw, 1.45rem);
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: -0.06em;
        text-align: center;
        white-space: nowrap;
        text-shadow: 0 1px 14px rgba(20, 40, 55, 0.18);
      }
      .cursor {
        opacity: 0.45;
        animation: blink 2.4s steps(1) infinite;
      }
      .time-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
      }
      .time-heading label {
        font-size: 0.58rem;
        opacity: 0.72;
      }
      .time-heading output {
        font-size: 0.65rem;
        font-variant-numeric: tabular-nums;
      }
      #live {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.45rem 0.5rem;
        min-height: 32px;
        border: 1px solid currentColor;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 0.55rem;
        cursor: pointer;
        opacity: 0.75;
      }
      #live::before {
        content: "";
        width: 4px;
        height: 4px;
        background: currentColor;
        opacity: 0.35;
      }
      #live[aria-pressed="true"]::before {
        background: #7cb582;
        opacity: 1;
        box-shadow: 0 0 7px rgba(124, 181, 130, 0.5);
      }
      #live:hover {
        opacity: 1;
      }
      #time {
        width: 100%;
        height: 38px;
        margin: 0.2rem 0 0;
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
        cursor: ew-resize;
        color: inherit;
      }
      #time::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 1px;
        background: linear-gradient(
          90deg,
          #385474,
          #9e899d 22%,
          #e8caaa 30%,
          #f3e3bd 50%,
          #ecb187 73%,
          #8e718d 81%,
          #385474
        );
      }
      #time::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 9px;
        height: 13px;
        margin-top: -5px;
        border: 2px solid currentColor;
        border-radius: 1px;
        background: #edf0df;
        box-shadow: 0 0 0 3px rgba(39, 53, 66, 0.1);
      }
      #time::-moz-range-track {
        height: 3px;
        background: linear-gradient(
          90deg,
          #385474,
          #e8caaa 30%,
          #f3e3bd 50%,
          #ecb187 73%,
          #385474
        );
      }
      #time::-moz-range-thumb {
        width: 6px;
        height: 10px;
        border: 2px solid currentColor;
        border-radius: 1px;
        background: #edf0df;
      }
      :focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 5px;
      }
      .time-scale {
        display: flex;
        justify-content: space-between;
        font-size: 0.45rem;
        opacity: 0.48;
        pointer-events: none;
      }
      .preview-note {
        margin: 0.5rem 0 0;
        text-align: center;
        font-size: 0.48rem;
        opacity: 0.55;
        display: none;
      }
      body[data-preview="true"] .preview-note {
        display: block;
      }
      .corner {
        position: fixed;
        z-index: 2;
        right: 1.6rem;
        bottom: max(1.4rem, env(safe-area-inset-bottom));
        display: flex;
        gap: 0.5rem;
      }
      .round {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        background: rgba(225, 236, 240, 0.14);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: inherit;
        cursor: pointer;
      }
      .round svg {
        width: 16px;
        height: 16px;
      }
      .round:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #sound[aria-pressed="false"] .waves {
        display: none;
      }
      .round[aria-pressed="true"] .mute {
        display: none;
      }
      #music[aria-pressed="false"] svg > path:not(.mute) {
        opacity: 0.55;
      }
      /* Field notes (moments.js): found by name, the rest as dashes. */
      .place-wrap {
        display: flex;
        align-items: start;
        gap: 0.9rem;
      }
      .place {
        padding: 0.2rem 0;
      }
      .notes-panel {
        left: 0;
        right: auto;
      }
      .notes-heading {
        margin: 0 0 0.6rem;
        font-size: 0.58rem;
        opacity: 0.72;
      }
      .notes-panel ol {
        display: grid;
        gap: 0.3rem;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 0.58rem;
      }
      .notes-panel li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
      }
      .notes-panel li time {
        opacity: 0.5;
        font-variant-numeric: tabular-nums;
      }
      .notes-panel li.unfound {
        display: block;
        margin-top: 0.3rem;
        opacity: 0.42;
        letter-spacing: 0.2em;
        line-height: 1.6;
        white-space: normal;
      }
      .notes-empty[hidden] {
        display: none;
      }
      /* The six gifts (journey.js): dim marks, lit in their colour once woken. */
      .gift-marks {
        display: flex;
        gap: 0.55rem;
        margin: 0 0 0.75rem;
      }
      .gift-marks[hidden],
      .gift-dots[hidden],
      .begin-again[hidden] {
        display: none;
      }
      .gift-mark {
        display: inline-flex;
        width: 17px;
        height: 17px;
        opacity: 0.26;
        transition: opacity 1.2s ease;
      }
      .gift-mark[data-awake="true"] {
        opacity: 1;
        /* Drawn in ink, lit from behind in the gift's colour. */
        filter: drop-shadow(0 0 2px var(--glow));
      }
      .gift-mark svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .gift-dots {
        display: inline-flex;
        gap: 2px;
        margin-left: 0.4rem;
        vertical-align: middle;
      }
      .gift-dots i {
        width: 3px;
        height: 3px;
        background: currentColor;
        opacity: 0.3;
      }
      .gift-dots i[style] {
        opacity: 1;
      }
      .begin-again {
        margin-top: 0.8rem;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 0.55rem;
        letter-spacing: 0.08em;
        opacity: 0.45;
        cursor: pointer;
      }
      .begin-again:hover,
      .begin-again:focus-visible {
        opacity: 0.85;
      }
      #notes-toggle[data-fresh="true"] > span:first-child::after {
        content: "";
        display: inline-block;
        width: 3px;
        height: 3px;
        margin: 0 0 0.15rem 0.35rem;
        background: currentColor;
        vertical-align: middle;
      }
      /* A discovery's line of type, low in the view. */
      .find-line {
        position: fixed;
        z-index: 2;
        left: 50%;
        bottom: calc(max(1.8rem, env(safe-area-inset-bottom)) + 3.4rem);
        transform: translateX(-50%);
        margin: 0;
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        white-space: nowrap;
        /* Light type, lifted off land, sea or sky by a soft dark halo. */
        color: #f6f3ea;
        text-shadow:
          0 1px 3px rgba(10, 24, 32, 0.55),
          0 0 16px rgba(10, 24, 32, 0.4);
        pointer-events: none;
        opacity: 0;
        transition: opacity 2s ease;
      }
      .find-line[data-state="in"] {
        opacity: 0.94;
        transition-duration: 1.4s;
      }
      /* The arrival: the name in the middle of the view, then the header. */
      .arrival {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-content: start center;
        /* In the sky, above the cat. */
        padding-top: 26vh;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.4s ease;
      }
      .arrival[hidden] {
        display: none;
      }
      .arrival[data-state="in"] {
        opacity: 1;
      }
      .arrival[data-state="out"] {
        opacity: 0;
        transition-duration: 2.6s;
      }
      .arrival p {
        margin: 0;
        color: #f6f3ea;
        text-shadow:
          0 1px 4px rgba(10, 24, 32, 0.45),
          0 0 24px rgba(10, 24, 32, 0.35);
      }
      .arrival-place {
        margin-bottom: 0.7rem !important;
        font-size: 0.62rem;
        letter-spacing: 0.32em;
        opacity: 0.8;
      }
      .arrival-name {
        font-size: clamp(1.7rem, 1.1rem + 2.2vw, 2.9rem);
        line-height: 1;
        letter-spacing: -0.06em;
      }
      /* A gift waking: its place, small, over what woke; high in the sky. */
      .gift-card {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-content: start center;
        padding: 13vh 16px 0;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.8s ease;
      }
      .gift-card[hidden] {
        display: none;
      }
      .gift-card[data-state="in"] {
        opacity: 1;
      }
      .gift-card[data-state="out"] {
        opacity: 0;
        transition-duration: 2.8s;
      }
      .gift-card p {
        margin: 0;
        color: #f6f3ea;
        text-shadow:
          0 1px 4px rgba(10, 24, 32, 0.5),
          0 0 24px rgba(10, 24, 32, 0.4);
      }
      .gift-small {
        margin-bottom: 0.65rem !important;
        font-size: 0.58rem;
        letter-spacing: 0.3em;
        opacity: 0.78;
      }
      .gift-big {
        font-size: clamp(0.95rem, 0.8rem + 0.7vw, 1.35rem);
        letter-spacing: 0.02em;
      }
      .gift-card[data-grand="true"] {
        padding-top: 26vh;
      }
      .gift-card[data-grand="true"] .gift-big {
        font-size: clamp(1.7rem, 1.1rem + 2.2vw, 2.9rem);
        line-height: 1;
        letter-spacing: -0.06em;
      }
      /* While a gift wakes, the corners step back. */
      body[data-ceremony="true"] .sky-meta,
      body[data-ceremony="true"] .corner,
      body[data-ceremony="true"] #hint {
        opacity: 0.15;
        transition: opacity 1.6s ease;
      }
      .sky-meta,
      .corner {
        transition: opacity 1.8s ease;
      }
      body[data-arrival="pending"] .sky-meta,
      body[data-arrival="pending"] .corner,
      body[data-arrival="pending"] #hint {
        opacity: 0;
        transition: none;
      }
      /* Sitting to watch: the camera drifts to the sky; the UI steps back. */
      body[data-watching="true"] .sky-meta,
      body[data-watching="true"] .corner,
      body[data-watching="true"] #hint {
        opacity: 0.12;
        transition: opacity 5s ease 1s;
      }
      /* Photo mode: nothing between the visitor and the view. */
      body[data-photo="true"] .sky-meta,
      body[data-photo="true"] .corner,
      body[data-photo="true"] #hint,
      body[data-photo="true"] .find-line {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease, visibility 0s 0.4s;
      }
      .photo-bar {
        position: fixed;
        z-index: 4;
        left: 50%;
        bottom: max(1.4rem, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.3rem 0.9rem 0.3rem 0.3rem;
        border-radius: 999px;
        background: rgba(20, 35, 45, 0.24);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #f3f1e8;
        font-size: 0.55rem;
        white-space: nowrap;
        transition: opacity 0.8s ease;
      }
      .photo-bar[hidden] {
        display: none;
      }
      .photo-bar[data-idle="true"] {
        opacity: 0;
      }
      .shutter {
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(250, 248, 240, 0.9) 0 52%, transparent 55%);
        cursor: pointer;
      }
      .shutter:active {
        background: radial-gradient(circle, rgba(250, 248, 240, 0.6) 0 46%, transparent 49%);
      }
      .photo-bar .opt {
        min-height: 28px;
        padding: 0.2rem 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        opacity: 0.6;
        cursor: pointer;
      }
      .photo-bar .opt:hover {
        opacity: 0.9;
      }
      .photo-bar .opt[aria-pressed="true"] {
        opacity: 1;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .photo-keys {
        opacity: 0.42;
      }
      .photo-status {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 0.6rem);
        transform: translateX(-50%);
        margin: 0;
        color: #f3f1e8;
        text-shadow: 0 1px 10px rgba(20, 40, 55, 0.5);
      }
      .photo-guide {
        position: fixed;
        z-index: 1;
        top: 50%;
        left: 50%;
        width: min(100vw, 239vh);
        aspect-ratio: 2.39 / 1;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 0 100vmax rgba(8, 14, 20, 0.42);
        pointer-events: none;
        display: none;
      }
      .photo-guide[data-wide="true"] {
        display: block;
      }
      .photo-flash {
        position: fixed;
        inset: 0;
        z-index: 5;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease-out;
      }
      .photo-flash[data-on="true"] {
        opacity: 0.3;
        transition: none;
      }
      @media (pointer: coarse) {
        .photo-keys {
          display: none;
        }
      }
      @media (orientation: portrait) {
        .wide-option {
          display: none;
        }
      }
      #hint {
        position: fixed;
        z-index: 2;
        left: 50%;
        bottom: max(1.8rem, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        margin: 0;
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
        background: rgba(20, 35, 45, 0.22);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #f3f1e8;
        font-size: 0.55rem;
        white-space: nowrap;
        pointer-events: none;
        transition: opacity 1.2s ease 0.5s;
      }
      #hint[data-hidden="true"] {
        opacity: 0;
      }
      #hint .touch {
        display: none;
      }
      @media (pointer: coarse) {
        #hint .touch {
          display: inline;
        }
        #hint .mouse {
          display: none;
        }
      }
      a {
        color: inherit;
        text-underline-offset: 3px;
      }
      @keyframes blink {
        0%,
        65%,
        100% {
          opacity: 0.45;
        }
        66%,
        99% {
          opacity: 0;
        }
      }
      @media (max-width: 640px) {
        .sky-meta {
          inset: max(0.9rem, env(safe-area-inset-top)) 1rem auto;
          grid-template-columns: auto 1fr;
          grid-template-areas: "name name" "place meta";
          row-gap: 0.3rem;
          font-size: 0.56rem;
        }
        .sky-meta > .conditions {
          gap: 0.5rem;
        }
        /* Notes under the place name, so the weather keeps its line; the
           panel opens from the header's left edge. */
        .place-wrap {
          position: relative;
          flex-direction: column;
          gap: 0;
        }
        .place-wrap > .panel-anchor {
          position: static;
        }
        #notes-toggle {
          padding-left: 0;
        }
        .toggle .long {
          display: none;
        }
        .corner {
          right: 1rem;
        }
        /* Above the corner buttons, not beside them. */
        #hint {
          bottom: calc(max(1.4rem, env(safe-area-inset-bottom)) + 48px);
        }
        .find-line {
          bottom: calc(max(1.4rem, env(safe-area-inset-bottom)) + 48px + 3.2rem);
        }
      }
      @media (max-height: 480px) {
        .sky-meta {
          inset: 0.8rem 1rem auto;
        }
      }

      /* The loading veil (src/loading-screen.js): a soft painting of the
         first view and the wisp over it. Everything moving is a transform
         or an opacity, so it runs on the compositor while the island
         builds. The gradient shows only until the painting is drawn. */
      .loading-screen {
        position: fixed; inset: 0; z-index: 100; overflow: hidden;
        background: linear-gradient(#34495a, #5d6f78 34%, #4c5d60 36%, #5a5a50);
        color: #f4f7f8; font-size: 0.68rem; letter-spacing: 0.08em;
        touch-action: none;
        --glow: 0;
      }
      .loading-screen canvas {
        position: absolute; inset: 0; width: 100%; height: 100%;
        opacity: 0; transition: opacity 1.4s ease;
      }
      .loading-screen canvas[data-shown] { opacity: 1; }
      .veil-paint { position: absolute; inset: 0; z-index: 0; transition: opacity 1.9s cubic-bezier(0.4, 0, 0.2, 1) 0.15s; }
      .loading-screen p {
        position: absolute; left: 0; right: 0; bottom: max(1.4rem, env(safe-area-inset-bottom)); margin: 0;
        text-align: center; opacity: 0.55; text-shadow: 0 1px 8px rgba(20, 40, 50, 0.4);
        transition: opacity 0.5s ease;
      }
      .wisp { position: absolute; inset: 0; pointer-events: none; transition: opacity 1.3s ease; }
      /* Each part glides to the same point (--x, --y), the tail a little
         later than the head: a comet's tail while it moves, one light at rest. */
      .wisp-part {
        position: absolute; left: 0; top: 0;
        transform: translate3d(var(--x, 50vw), var(--y, 60vh), 0);
        transition: transform calc(var(--move, 0s) + var(--k) * 45ms) cubic-bezier(0.45, 0.05, 0.3, 1);
      }
      .wisp-bob { animation: wisp-bob 4.4s ease-in-out infinite; animation-delay: calc(var(--k) * 60ms - 4.4s); }
      /* Brighter as the world builds (--glow, 0…1); the tail fainter and finer. */
      .wisp-size {
        transform: scale(calc((0.5 + 0.5 * var(--glow)) * (1 - var(--k) * 0.07)));
        opacity: calc((0.45 + 0.55 * var(--glow)) * (1 - var(--k) * 0.085));
        transition: transform 2.4s ease, opacity 2.4s ease;
      }
      .wisp-light {
        width: 128px; height: 128px; margin: -64px; border-radius: 50%;
        background: radial-gradient(closest-side, #fffdf4 0, rgba(255, 246, 216, 0.95) 6%, rgba(255, 214, 140, 0.62) 12%,
          rgba(255, 196, 110, 0.26) 26%, rgba(255, 190, 110, 0.09) 52%, rgba(255, 190, 110, 0) 100%);
        animation: wisp-breathe 3.1s ease-in-out infinite;
      }
      .wisp-part + .wisp-part .wisp-light {
        background: radial-gradient(closest-side, rgba(255, 244, 214, 0.7) 0, rgba(255, 214, 146, 0.3) 18%, rgba(255, 200, 130, 0) 52%);
        animation: none;
      }
      @keyframes wisp-bob {
        0%, 100% { transform: translate3d(0, 0, 0); }
        30% { transform: translate3d(5px, -7px, 0); }
        65% { transform: translate3d(-4px, 4px, 0); }
      }
      @keyframes wisp-breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.78; }
      }
      .loading-screen[data-state="leaving"],
      .loading-screen[data-state="settling"] { pointer-events: none; }
      .loading-screen[data-state="leaving"] .veil-paint,
      .loading-screen[data-state="settling"] .veil-paint,
      .loading-screen[data-state="leaving"] p,
      .loading-screen[data-state="settling"] p { opacity: 0; }
      .loading-screen[data-state="leaving"],
      .loading-screen[data-state="settling"] { background: transparent; }
      .loading-screen[data-state="settling"] .wisp { opacity: 0; }
      .loading-screen[data-state="failed"] { opacity: 0; pointer-events: none; transition: opacity 0.9s ease; }
      .loading-screen[hidden] { display: none; }
      /* Reduced motion: no drifting, only a plain cross-fade. */
      @media (prefers-reduced-motion: reduce) {
        .loading-screen[data-state] { opacity: 0; transition: opacity 0.9s ease !important; }
      }
      /* The lens's gentle corner falloff, composited for free over both
         canvases (the rain and glare pass is src/lens.js). */
      .vignette {
        position: fixed; inset: 0; z-index: 1; pointer-events: none;
        background: radial-gradient(ellipse farthest-corner, transparent 0, rgba(0, 0, 0, 0.012) 35%, rgba(0, 0, 0, 0.045) 70%, rgba(0, 0, 0, 0.1) 100%);
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body data-scene="0" data-arrival="pending">
    <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
      <div class="veil-paint" aria-hidden="true"><canvas></canvas><canvas></canvas></div>
      <div class="wisp" aria-hidden="true"></div>
      <p>loading</p>
    </div>

    <div class="fallback" aria-hidden="true"></div>
    <canvas id="sky" aria-hidden="true"></canvas>
    <canvas id="landscape" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <header class="sky-meta">
      <div class="place-wrap">
        <div class="place">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M6 1h4v2h2v2h1v5h-2v2H9v3H7v-3H5v-2H3V5h1V3h2Z"
              stroke="currentColor"
            />
            <path d="M7 5h2v3H7z" fill="currentColor" /></svg
          ><span>cape town</span>
        </div>
        <div class="panel-anchor">
          <button
            id="notes-toggle"
            class="toggle"
            type="button"
            aria-expanded="false"
            aria-controls="notes-panel"
          >
            <span><span class="long">field </span>notes</span>
            <span class="gift-dots" aria-hidden="true" hidden></span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <section id="notes-panel" class="notes-panel" aria-label="Field notes" hidden>
            <p class="notes-heading">field notes</p>
            <div class="gift-marks" role="img" hidden></div>
            <ol></ol>
            <p class="source notes-empty">nothing yet · go and look</p>
            <button class="begin-again" type="button" hidden>begin again</button>
          </section>
        </div>
      </div>
      <h1>sky cope<span class="cursor">_</span></h1>
      <div class="conditions">
        <div class="panel-anchor">
          <button
            id="time-toggle"
            class="toggle"
            type="button"
            aria-expanded="false"
            aria-controls="time-panel"
            aria-label="Time of day"
          >
            <span>--:--</span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <section id="time-panel" class="time-panel" aria-label="Sky time preview" hidden>
            <div class="time-heading">
              <label for="time">time · SAST</label
              ><output id="time-label" for="time">--:--</output
              ><button id="live" type="button" aria-pressed="true">live</button>
            </div>
            <input
              id="time"
              type="range"
              min="0"
              max="1439"
              step="1"
              value="720"
              aria-label="Preview Cape Town time of day"
            />
            <div class="time-scale" aria-hidden="true">
              <span>00</span><span>06</span><span>12</span><span>18</span
              ><span>24</span>
            </div>
            <p class="preview-note">preview · current weather</p>
          </section>
        </div>
        <div class="panel-anchor">
        <button
          id="weather-toggle"
          class="toggle"
          type="button"
          aria-expanded="false"
          aria-controls="weather-panel"
        >
          <span id="conditions" role="status">weather…</span>
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <section id="weather-panel" class="weather-panel" aria-label="Weather" hidden>
          <div class="presets" role="group" aria-label="Weather preset">
            <button type="button" data-preset="live">live</button>
            <button type="button" data-preset="clear">clear</button>
            <button type="button" data-preset="cloudy">cloudy</button>
            <button type="button" data-preset="overcast">overcast</button>
            <button type="button" data-preset="rain">rain</button>
            <button type="button" data-preset="storm">storm</button>
          </div>
          <label class="dial">
            <span>cloud</span>
            <input id="weather-cover" name="cover" type="range" min="0" max="100" step="1" value="0" />
            <output for="weather-cover">0%</output>
          </label>
          <label class="dial">
            <span>wind</span>
            <input id="weather-speed" name="speed" type="range" min="0" max="20" step="1" value="0" />
            <output for="weather-speed">0 m/s</output>
          </label>
          <label class="dial">
            <span>from</span>
            <input id="weather-direction" name="direction" type="range" min="0" max="355" step="5" value="0" />
            <output for="weather-direction">n 0°</output>
          </label>
          <label class="dial">
            <span>rain</span>
            <input id="weather-rain" name="rain" type="range" min="0" max="10" step="0.5" value="0" />
            <output for="weather-rain">0 mm/h</output>
          </label>
          <p class="source">
            live data: <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">open-meteo</a> model
          </p>
        </section>
        </div>
      </div>
    </header>
    <!-- The hint teaches one thing at a time (moments.js lessons). -->
    <p id="hint" data-hidden="true"><span class="mouse"></span><span class="touch"></span></p>
    <div id="arrival" class="arrival" aria-hidden="true" hidden>
      <p class="arrival-place">cape town</p>
      <p class="arrival-name">sky cope</p>
    </div>
    <p id="find-line" class="find-line" role="status" aria-live="polite"></p>
    <!-- A gift waking (journey.js): the place, and what woke. -->
    <div id="gift-card" class="gift-card" role="status" aria-live="polite" hidden>
      <p class="gift-small"></p>
      <p class="gift-big"></p>
    </div>
    <div class="corner">
      <button id="photo" class="round" type="button" aria-label="Photo mode (p)" title="photo · p">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M2.5 5.5h2l1-2h5l1 2h2v7h-11z" />
          <path d="M6.5 7.5h3v3h-3z" />
        </svg>
      </button>
      <button id="music" class="round" type="button" aria-pressed="true" aria-label="Music" title="music">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M6.5 11.5v-8l6-1.5v8" />
          <path d="M3.5 10.5h3v3h-3zM9.5 9h3v3h-3z" fill="currentColor" stroke="none" />
          <path class="mute" d="M2.5 2.5l11 11" />
        </svg>
      </button>
      <button id="sound" class="round" type="button" aria-pressed="true" aria-label="Sound" title="sound">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor" stroke="none" />
          <path class="waves" d="M11 5.5c1 1.4 1 3.6 0 5M13 3.5c2 2.5 2 6.5 0 9" />
          <path class="mute" d="M11 6l4 4M15 6l-4 4" />
        </svg>
      </button>
    </div>
    <!-- Photo mode (photo-mode.js): never part of the saved picture. -->
    <div id="photo-guide" class="photo-guide" aria-hidden="true"></div>
    <div id="photo-flash" class="photo-flash" aria-hidden="true"></div>
    <div id="photo-bar" class="photo-bar" role="toolbar" aria-label="Photo" hidden>
      <button class="shutter" type="button" aria-label="Save photo (s)"></button>
      <button class="opt wide-option" type="button" data-photo="frame" aria-pressed="false">wide</button>
      <button class="opt" type="button" data-photo="caption" aria-pressed="false">caption</button>
      <button class="opt" type="button" data-photo="pause" aria-pressed="false">pause time</button>
      <button class="opt" type="button" data-photo="exit">done</button>
      <span class="photo-keys" aria-hidden="true">s save · space pause · esc</span>
      <p class="photo-status" role="status" aria-live="polite"></p>
    </div>
    <!-- The loading veil paints first; the world (main.js) loads behind it. -->
    <script type="module">
      import { loading } from "/src/loading-screen.js";
      import("/src/main.js").then(() => loading.progress("start"), (error) => loading.fail(error));
    </script>
  </body>
</html>
